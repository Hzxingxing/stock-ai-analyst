[project]
name = "stock-ai-analyst"
version = "0.1.0"
description = "Evidence-grounded A-share research assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "akshare>=1.14.0",
    "alembic>=1.13.0",
    "apscheduler>=3.10.4,<4.0.0",
    "asyncmy>=0.2.10",
    "email-validator>=2.0.0",
    "fastapi>=0.115.0",
    "langchain-openai>=1.0.0,<2.0.0",
    "langgraph>=1.0.0,<2.0.0",
    "langgraph-checkpoint-mysql>=3.0.0,<4.0.0",
    "pandas>=2.2.0",
    "pydantic-settings>=2.6.0",
    "PyJWT>=2.9.0",
    "pwdlib[argon2]>=0.2.0",
    "pymysql[rsa]>=1.1.0",
    "redis>=5.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
ignore = ["B008"]

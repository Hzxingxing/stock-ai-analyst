<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - 股票AI分析系统</title>

    <!-- Element Plus CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.5.6/dist/index.css" />

    <!-- Custom CSS -->
    <link href="/static/css/style.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
        }

        .main-container {
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 20px;
        }

        /* Element Plus Menu 自定义样式 */
        .el-menu--horizontal {
            border-bottom: none;
        }

        /* Markdown 渲染样式 */
        .markdown-body {
            font-size: 14px;
            line-height: 1.8;
        }

        .markdown-body h1 {
            font-size: 24px;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .markdown-body h2 {
            font-size: 20px;
            margin-top: 16px;
            margin-bottom: 8px;
        }

        .markdown-body h3 {
            font-size: 16px;
            margin-top: 12px;
            margin-bottom: 6px;
        }

        .markdown-body ul, .markdown-body ol {
            padding-left: 24px;
        }

        .markdown-body li {
            margin: 4px 0;
        }
    </style>
</head>
<body>
    <div id="nav-app">
        <el-menu
            mode="horizontal"
            :default-active="activeIndex"
            background-color="#545c64"
            text-color="#fff"
            active-text-color="#ffd04b"
        >
            <el-menu-item index="0" style="pointer-events: none; opacity: 1;">
                <el-icon><component :is="'TrendCharts'" /></el-icon>
                <span style="font-weight: bold; margin-left: 8px;">股票AI分析系统</span>
            </el-menu-item>
            <el-menu-item index="/dashboard" @click="navigate('/dashboard')">
                <el-icon><component :is="'DataAnalysis'" /></el-icon>
                <span>仪表板</span>
            </el-menu-item>
            <el-menu-item index="/stocks" @click="navigate('/stocks')">
                <el-icon><component :is="'List'" /></el-icon>
                <span>股票管理</span>
            </el-menu-item>
            <el-menu-item index="/reports" @click="navigate('/reports')">
                <el-icon><component :is="'Document'" /></el-icon>
                <span>分析报告</span>
            </el-menu-item>
        </el-menu>
    </div>

    <div class="main-container">
        {% block content %}{% endblock %}
    </div>

    <!-- Vue 3 (开发版，用于调试) -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.js"></script>

    <!-- Element Plus -->
    <script src="https://cdn.jsdelivr.net/npm/element-plus@2.5.6/dist/index.full.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/element-plus@2.5.6/dist/locale/zh-cn.min.js"></script>

    <!-- Element Plus Icons -->
    <script src="https://cdn.jsdelivr.net/npm/@element-plus/icons-vue@2.3.1/dist/index.iife.min.js"></script>

    <!-- ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>

    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>

    <!-- Marked (Markdown解析) -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>

    <!-- 导航栏 Vue 应用 -->
    <script>
    const { createApp } = Vue;
    const { ElMessage, ElMessageBox, ElLoading } = ElementPlus;

    const navApp = createApp({
        setup() {
            // 根据当前路径设置活动菜单项
            const currentPath = window.location.pathname;
            const activeIndex = Vue.ref(currentPath);

            const navigate = (path) => {
                window.location.href = path;
            };

            return {
                activeIndex,
                navigate
            };
        }
    });

    // 注册 Element Plus
    navApp.use(ElementPlus, {
        locale: ElementPlusLocaleZhCn,
    });

    // 注册所有图标
    for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
        navApp.component(key, component);
    }

    navApp.mount('#nav-app');

    // 全局消息提示函数（替代原有的 showToast）
    window.showMessage = (message, type = 'info') => {
        ElMessage({
            message,
            type,
            duration: 3000
        });
    };

    window.showSuccess = (message) => window.showMessage(message, 'success');
    window.showError = (message) => window.showMessage(message, 'error');
    window.showWarning = (message) => window.showMessage(message, 'warning');
    window.showInfo = (message) => window.showMessage(message, 'info');
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>

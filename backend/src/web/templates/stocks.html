{% extends "base.html" %}

{% block content %}
{% raw %}
<div id="app" v-cloak>
    <!-- 页面标题 -->
    <div style="margin-bottom: 20px;">
        <h2 style="margin: 0;">
            <el-icon><component :is="'TrendCharts'" /></el-icon>
            <span style="margin-left: 8px;">股票管理</span>
        </h2>
    </div>

    <!-- 搜索区域 -->
    <el-row :gutter="20" style="margin-bottom: 20px;">
        <el-col :lg="16" :xl="12" style="margin: 0 auto;">
            <el-card shadow="hover" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                <template #header>
                    <div style="display: flex; justify-content: space-between; align-items: center; color: white;">
                        <span style="font-weight: bold;">
                            <el-icon><component :is="'Search'" /></el-icon>
                            <span style="margin-left: 8px;">搜索市场股票</span>
                        </span>
                        <el-button type="info" size="small" :loading="refreshLoading" @click="handleRefreshCache">
                            <el-icon><component :is="'Refresh'" /></el-icon>
                            <span style="margin-left: 4px;">刷新市场</span>
                        </el-button>
                    </div>
                </template>
                <el-input
                    v-model="searchKeyword"
                    placeholder="输入股票代码或名称，即时搜索全市场..."
                    size="large"
                    clearable
                    @input="handleSearchInput"
                >
                    <template #prefix>
                        <el-icon><component :is="'Search'" /></el-icon>
                    </template>
                </el-input>

                <!-- 搜索结果 -->
                <div v-if="searchResults.length > 0" style="margin-top: 16px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                        <span style="color: white; font-weight: bold;">
                            <el-icon><Search /></el-icon>
                            <span style="margin-left: 4px;">搜索结果</span>
                        </span>
                        <el-tag type="info">{{ searchResults.length }} 条结果</el-tag>
                    </div>
                    <div style="max-height: 400px; overflow-y: auto;">
                        <el-space direction="vertical" :size="8" style="width: 100%;">
                            <el-card
                                v-for="stock in searchResults"
                                :key="stock.code"
                                shadow="hover"
                                :body-style="{ padding: '12px' }"
                            >
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <div>
                                        <el-tag :type="stock.market === 'SH' ? 'primary' : 'success'" size="small">
                                            {{ stock.market }}
                                        </el-tag>
                                        <strong style="margin-left: 8px; color: #409EFF;">{{ stock.code }}</strong>
                                        <span style="margin-left: 8px;">{{ stock.name }}</span>
                                    </div>
                                    <el-button type="primary" size="small" round @click="handleAddStock(stock)">
                                        <el-icon><component :is="'Plus'" /></el-icon>
                                        <span style="margin-left: 4px;">添加</span>
                                    </el-button>
                                </div>
                            </el-card>
                        </el-space>
                    </div>
                </div>

                <!-- 搜索加载中 -->
                <div v-if="searchLoading" style="text-align: center; margin-top: 16px; color: white;">
                    <el-icon class="is-loading"><component :is="'Loading'" /></el-icon>
                    <span style="margin-left: 8px;">搜索中...</span>
                </div>
            </el-card>
        </el-col>
    </el-row>

    <!-- 股票列表 -->
    <el-card shadow="never">
        <template #header>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-weight: bold;">
                    <el-icon><component :is="'List'" /></el-icon>
                    <span style="margin-left: 8px;">我的股票分析列表</span>
                </span>
                <el-tag type="primary">{{ stocks.length }} 只</el-tag>
            </div>
        </template>

        <el-table :data="stocks" stripe border v-loading="stocksLoading" style="width: 100%">
            <el-table-column label="代码" width="110">
                <template #default="{ row }">
                    <span style="font-weight: bold; color: #606266;">
                        {{ row.stock_code }}
                    </span>
                </template>
            </el-table-column>

            <el-table-column label="名称" width="120">
                <template #default="{ row }">
                    <a :href="'/stocks/' + row.stock_code" style="text-decoration: none; font-weight: bold; color: #409EFF;">
                        {{ row.stock_name }}
                    </a>
                </template>
            </el-table-column>

            <el-table-column label="市场" width="80" align="center">
                <template #default="{ row }">
                    <el-tag :type="row.market === 'SH' ? 'primary' : 'success'" size="small" round>
                        {{ row.market }}
                    </el-tag>
                </template>
            </el-table-column>

            <el-table-column label="最新分析" width="120">
                <template #default="{ row }">
                    <el-text v-if="row.latest_analysis_date" type="info" size="small">
                        {{ row.latest_analysis_date }}
                    </el-text>
                    <el-text v-else type="warning" size="small">暂无</el-text>
                </template>
            </el-table-column>

            <el-table-column label="评分/建议" min-width="200">
                <template #default="{ row }">
                    <div v-if="row.latest_analysis" style="display: flex; align-items: center; gap: 4px;">
                        <el-tag type="primary" size="small" round>
                            {{ row.latest_analysis.technical_score || '-' }}
                        </el-tag>
                        <el-tag type="success" size="small" round>
                            {{ row.latest_analysis.fundamental_score || '-' }}
                        </el-tag>
                        <el-text type="info" size="small">
                            {{ row.latest_analysis.suggestion || '-' }}
                        </el-text>
                    </div>
                    <el-text v-else type="info" size="small">-</el-text>
                </template>
            </el-table-column>

            <el-table-column label="风险" width="80" align="center">
                <template #default="{ row }">
                    <el-tag
                        v-if="row.latest_analysis"
                        :type="getRiskType(row.latest_analysis.risk_level)"
                        size="small"
                    >
                        {{ row.latest_analysis.risk_level }}
                    </el-tag>
                    <el-text v-else type="info" size="small">-</el-text>
                </template>
            </el-table-column>

            <el-table-column label="数据量" width="110">
                <template #default="{ row }">
                    <el-text type="info" size="small">
                        K线: {{ row.kline_count || 0 }}<br>
                        财务: {{ row.financial_count || 0 }}
                    </el-text>
                </template>
            </el-table-column>

            <el-table-column label="自动任务" width="100" align="center">
                <template #default="{ row }">
                    <el-tooltip :content="row.is_active ? '已启用自动同步和分析' : '已停用自动同步和分析'" placement="top">
                        <el-switch
                            v-model="row.is_active"
                            :active-value="1"
                            :inactive-value="0"
                            @change="handleToggleStock(row)"
                        />
                    </el-tooltip>
                </template>
            </el-table-column>

            <el-table-column label="添加时间" min-width="120">
                <template #default="{ row }">
                    <el-text type="info" size="small">
                        {{ formatDate(row.created_at) }}
                    </el-text>
                </template>
            </el-table-column>

            <el-table-column label="操作" width="220" align="center" fixed="right">
                <template #default="{ row }">
                    <el-button-group>
                        <el-tooltip content="同步数据" placement="top">
                            <el-button type="info" size="small" @click="handleSyncStock(row.stock_code)">
                                <el-icon><component :is="'Refresh'" /></el-icon>
                            </el-button>
                        </el-tooltip>
                        <el-tooltip content="AI分析" placement="top">
                            <el-button type="primary" size="small" @click="handleAnalyzeStock(row.stock_code)">
                                <el-icon><component :is="'Cpu'" /></el-icon>
                            </el-button>
                        </el-tooltip>
                        <el-tooltip content="删除" placement="top">
                            <el-button type="danger" size="small" @click="handleDeleteStock(row)">
                                <el-icon><component :is="'Delete'" /></el-icon>
                            </el-button>
                        </el-tooltip>
                    </el-button-group>
                </template>
            </el-table-column>

            <template #empty>
                <el-empty description="暂无股票数据，请搜索并添加" />
            </template>
        </el-table>
    </el-card>
</div>
{% endraw %}
{% endblock %}

{% block scripts %}
<script>
const { ref, reactive, onMounted } = Vue;

const stocksApp = createApp({
    setup() {
        // 响应式数据
        const stocks = ref([]);
        const stocksLoading = ref(false);
        const searchKeyword = ref('');
        const searchResults = ref([]);
        const searchLoading = ref(false);
        const refreshLoading = ref(false);

        let searchTimeout = null;

        // 防抖函数
        const debounce = (fn, delay) => {
            return function(...args) {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    fn.apply(this, args);
                }, delay);
            };
        };

        // 加载股票列表
        const loadStocks = async () => {
            stocksLoading.value = true;
            try {
                const { data } = await axios.get('/api/stocks');

                if (data.success) {
                    stocks.value = data.data;
                }
            } catch (error) {
                console.error('加载股票列表失败:', error);
                ElMessage.error('加载股票列表失败');
            } finally {
                stocksLoading.value = false;
            }
        };

        // 搜索输入处理
        const handleSearchInput = debounce(async () => {
            const keyword = searchKeyword.value.trim();

            if (!keyword) {
                searchResults.value = [];
                return;
            }

            searchLoading.value = true;
            searchResults.value = [];

            try {
                const { data } = await axios.post('/api/stocks/search', {
                    keyword,
                    limit: 20
                });

                if (data.success) {
                    searchResults.value = data.data;

                    if (data.data.length === 0) {
                        ElMessage.info('未找到匹配的股票');
                    }
                }
            } catch (error) {
                console.error('搜索失败:', error);
                ElMessage.error('搜索失败');
            } finally {
                searchLoading.value = false;
            }
        }, 400);

        // 添加股票
        const handleAddStock = async (stock) => {
            try {
                await ElMessageBox.confirm(
                    `确定要添加 ${stock.name}(${stock.code}) 到分析列表吗?`,
                    '确认添加',
                    {
                        confirmButtonText: '确定',
                        cancelButtonText: '取消',
                        type: 'info'
                    }
                );

                const { data } = await axios.post('/api/stocks', {
                    stock_code: stock.code,
                    stock_name: stock.name,
                    market: stock.market
                });

                if (data.success) {
                    ElMessage.success(data.message || '添加成功');
                    loadStocks();

                    // 清空搜索
                    searchKeyword.value = '';
                    searchResults.value = [];
                } else {
                    ElMessage.error(data.message || '添加失败');
                }
            } catch (error) {
                if (error !== 'cancel') {
                    console.error('添加股票失败:', error);
                    ElMessage.error('添加股票失败');
                }
            }
        };

        // 切换股票状态
        const handleToggleStock = async (row) => {
            try {
                const { data } = await axios.put(`/api/stocks/${row.stock_code}`, {
                    is_active: row.is_active
                });

                if (data.success) {
                    ElMessage.success(data.message || '操作成功');
                } else {
                    ElMessage.error(data.message || '操作失败');
                    // 失败时恢复状态
                    row.is_active = !row.is_active;
                }
            } catch (error) {
                console.error('切换状态失败:', error);
                ElMessage.error('操作失败');
                // 失败时恢复状态
                row.is_active = !row.is_active;
            }
        };

        // 删除股票
        const handleDeleteStock = async (row) => {
            try {
                await ElMessageBox.confirm(
                    `确定要删除股票 ${row.stock_name}(${row.stock_code}) 吗?\n\n此操作将彻底删除该股票及其所有关联数据（K线、财务、公告、新闻、分析结果等），不可恢复！`,
                    '确认删除',
                    {
                        confirmButtonText: '确定删除',
                        cancelButtonText: '取消',
                        type: 'warning'
                    }
                );

                const { data } = await axios.delete(`/api/stocks/${row.stock_code}`);

                if (data.success) {
                    ElMessage.success(data.message || '删除成功');
                    loadStocks();
                } else {
                    ElMessage.error(data.message || '删除失败');
                }
            } catch (error) {
                if (error !== 'cancel') {
                    console.error('删除失败:', error);
                    ElMessage.error('删除失败');
                }
            }
        };

        // 同步股票数据
        const handleSyncStock = async (stockCode) => {
            try {
                await ElMessageBox.confirm(
                    `确定要同步股票 ${stockCode} 的数据吗？\n\n这将从AKShare获取最新的K线、财务、公告等数据。`,
                    '确认同步',
                    {
                        confirmButtonText: '确定',
                        cancelButtonText: '取消',
                        type: 'info'
                    }
                );

                const loading = ElLoading.service({ text: '正在同步数据...' });

                try {
                    const { data } = await axios.post(`/api/stocks/${stockCode}/sync`);

                    if (data.success) {
                        ElMessage.success(`股票 ${stockCode} 数据同步成功！`);
                        loadStocks();
                    } else {
                        ElMessage.error('同步失败: ' + data.message);
                    }
                } finally {
                    loading.close();
                }
            } catch (error) {
                if (error !== 'cancel') {
                    console.error('同步数据失败:', error);
                    ElMessage.error('同步数据失败');
                }
            }
        };

        // AI分析股票
        const handleAnalyzeStock = async (stockCode) => {
            try {
                await ElMessageBox.confirm(
                    `确定要对股票 ${stockCode} 进行AI分析吗？\n\n系统将使用Gemini AI分析该股票的技术面和基本面。`,
                    '确认分析',
                    {
                        confirmButtonText: '确定',
                        cancelButtonText: '取消',
                        type: 'info'
                    }
                );

                const loading = ElLoading.service({ text: '正在进行AI分析...' });

                try {
                    const { data } = await axios.post(`/api/stocks/${stockCode}/analyze`);

                    if (data.success) {
                        const suggestion = data.data?.suggestion || '-';
                        const riskLevel = data.data?.risk_level || '-';
                        ElMessage.success(`股票 ${stockCode} AI分析成功！建议: ${suggestion}, 风险: ${riskLevel}`);
                        loadStocks();
                    } else {
                        ElMessage.error('分析失败: ' + data.message);
                    }
                } finally {
                    loading.close();
                }
            } catch (error) {
                if (error !== 'cancel') {
                    console.error('AI分析失败:', error);
                    ElMessage.error('AI分析失败');
                }
            }
        };

        // 刷新市场缓存
        const handleRefreshCache = async () => {
            refreshLoading.value = true;

            try {
                const { data } = await axios.post('/api/admin/refresh-cache');

                if (data.success) {
                    ElMessage.success('市场数据刷新成功');
                } else {
                    ElMessage.error('刷新失败: ' + data.message);
                }
            } catch (error) {
                console.error('刷新缓存失败:', error);
                ElMessage.error('刷新市场数据失败');
            } finally {
                refreshLoading.value = false;
            }
        };

        // 获取风险类型
        const getRiskType = (riskLevel) => {
            const typeMap = {
                '低': 'success',
                '中': 'warning',
                '高': 'danger'
            };
            return typeMap[riskLevel] || 'info';
        };

        // 格式化日期
        const formatDate = (dateStr) => {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleDateString('zh-CN');
        };

        // 初始化
        onMounted(() => {
            loadStocks();
        });

        return {
            stocks,
            stocksLoading,
            searchKeyword,
            searchResults,
            searchLoading,
            refreshLoading,
            handleSearchInput,
            handleAddStock,
            handleToggleStock,
            handleDeleteStock,
            handleSyncStock,
            handleAnalyzeStock,
            handleRefreshCache,
            getRiskType,
            formatDate
        };
    }
});

// 注册 Element Plus
stocksApp.use(ElementPlus, {
    locale: ElementPlusLocaleZhCn,
});

// 注册所有图标
for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
    stocksApp.component(key, component);
}

stocksApp.mount('#app');
</script>

<style scoped>
[v-cloak] {
    display: none;
}
</style>
{% endblock %}

version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: stock-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: stock_analysis
      MYSQL_USER: stock_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - stock-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: ./backend
    container_name: stock-web
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      NEWAPI_KEY: ${NEWAPI_KEY}
      NEWAPI_ENDPOINT: ${NEWAPI_ENDPOINT}
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /Users/asta/PycharmProjects/mywork/stock_analyzer:/app/stock_analyzer:ro
    command: uvicorn src.web.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - stock-network
    restart: unless-stopped

  scheduler:
    build: ./backend
    container_name: stock-scheduler
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      NEWAPI_KEY: ${NEWAPI_KEY}
      NEWAPI_ENDPOINT: ${NEWAPI_ENDPOINT}
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    volumes:
      - ./backend:/app
      - /Users/asta/PycharmProjects/mywork/stock_analyzer:/app/stock_analyzer:ro
    command: python -m src.scheduler.daily_job
    networks:
      - stock-network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local

networks:
  stock-network:
    driver: bridge
